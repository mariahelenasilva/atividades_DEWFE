<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Aula JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <label id="mensagem"></label><br>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <button id="viewSenha">Mostrar/Ocultar</button><br>
    <br>

    <input type="checkbox" name="souEstudante" id="souEstudante">Sou estudante</input><br>
    <br>

    <fieldset id="caixaSouEstudante" style="display: none;">
        <label for="curso">Curso: </label><br>
        <input type="text" id="curso"><br>
        <label for="instituicao">Instituição: </label><br>
        <input type="text" id="instituicao"><br>
        <br>
        <label for="periodo">Período: </label>
        <input type="date" name="periodo" id="periodo">
        <label for="a"> a </label>
        <input type="date" name="a" id="a">
    </fieldset>

    <script src="script.js"></script>
